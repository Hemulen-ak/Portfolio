<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create | Arun Karki</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <link rel="icon" type="image/jpeg" href="profile 1.jpg">
    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Merriweather:wght@400;700&family=Mukta:wght@400;700&family=Outfit:wght@400;600;800&family=Playfair+Display:wght@400;700&family=Quicksand:wght@400;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <nav id="navbar">
        <a href="index.html" class="nav-brand">AK</a>
        <div class="nav-links">
            <a href="about.html" data-tooltip="About"><i class="fa-solid fa-user-astronaut"></i></a>
            <a href="skills.html" data-tooltip="Skills"><i class="fa-solid fa-bolt"></i></a>
            <a href="experience.html" data-tooltip="Experience"><i class="fa-solid fa-briefcase"></i></a>
            <a href="portfolio.html" data-tooltip="Portfolio"><i class="fa-solid fa-folder-open"></i></a>
            <a href="create.html" class="active" data-tooltip="Create"><i
                    class="fa-solid fa-wand-magic-sparkles"></i></a>
        </div>
        <div class="nav-cta">
            <a href="contact.html" class="btn-nav-icon" data-tooltip="Hire Me"><i
                    class="fa-solid fa-comment-dots"></i></a>
        </div>
    </nav>

    <main style="padding-top: 8rem; padding-bottom: 12rem;">
        <div class="container">
            <header style="margin-bottom: 3rem; text-align: center;">
                <p
                    style="color: var(--accent-amber); font-family: var(--font-heading); font-weight: 500; font-size: 0.8rem; margin-bottom: 1rem; letter-spacing: 0.2em;">
                    CREATION STUDIO</p>
                <h1 class="heading-clash">Design & Download</h1>
            </header>

            <div class="studio-grid"
                style="display: grid; grid-template-columns: 350px 1fr; gap: 2rem; align-items: start;">
                <!-- Controls Sidebar -->
                <aside
                    style="background: var(--bg-card); padding: 2rem; border: 1px solid var(--border-subtle); border-radius: 12px; display: flex; flex-direction: column; gap: 1.5rem;">

                    <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                        <label class="heading-clash" style="font-size: 0.8rem; color: var(--accent-amber);">What do you
                            wanna make today ?</label>
                        <select id="template-selector"
                            style="background: var(--bg-charcoal); border: 1px solid var(--border-subtle); padding: 0.6rem; color: var(--text-off-white); border-radius: 6px; outline: none; font-family: var(--font-body); width: 100%;">
                            <option value="wall-calendar" style="background: var(--bg-charcoal);">Wall Calendar
                            </option>
                            <option value="table-calendar" style="background: var(--bg-charcoal);">Table Calendar
                            </option>
                        </select>
                    </div>

                    <!-- Style Selector -->
                    <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                        <label class="heading-clash" style="font-size: 0.7rem; color: var(--text-muted);">Style</label>
                        <div id="style-btns" style="display: flex; flex-wrap: wrap; gap: 0.4rem;">
                            <!-- JS populated -->
                        </div>
                    </div>

                    <hr style="border: none; border-top: 1px solid var(--border-subtle);">

                    <!-- Calendar Controls (Wall & Table share these) -->
                    <div id="controls-calendar" style="display: none; flex-direction: column; gap: 1rem;">
                        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                            <label class="heading-clash" style="font-size: 0.7rem; color: var(--text-muted);">Calendar
                                Mode</label>
                            <select id="calendar-mode-input"
                                style="background: transparent; border: 1px solid var(--border-subtle); padding: 0.5rem; color: var(--text-off-white); font-family: var(--font-body); border-radius: 4px; outline: none;">
                                <option value="personal" style="background: var(--bg-charcoal);" selected>Personal
                                </option>
                                <option value="organization" style="background: var(--bg-charcoal);">Organization
                                </option>
                            </select>
                        </div>

                        <div id="org-details-box"
                            style="display: none; flex-direction: column; gap: 0.8rem; padding: 0.8rem; background: rgba(232, 164, 48, 0.05); border: 1px solid rgba(232, 164, 48, 0.2); border-radius: 8px;">
                            <div style="display: flex; flex-direction: column; gap: 0.4rem;">
                                <label
                                    style="font-size: 0.65rem; color: var(--accent-amber); font-weight: 700;">Organization
                                    Name</label>
                                <input type="text" id="org-name-input" placeholder="Enter name here..."
                                    style="background: var(--bg-charcoal); border: 1px solid var(--border-subtle); padding: 0.5rem; color: var(--text-off-white); border-radius: 4px; outline: none; font-size: 0.75rem;">
                            </div>
                            <div style="display: flex; flex-direction: column; gap: 0.4rem;">
                                <label
                                    style="font-size: 0.65rem; color: var(--accent-amber); font-weight: 700;">Organization
                                    Logo</label>
                                <input type="file" id="org-logo-input" accept="image/*"
                                    style="font-size: 0.6rem; color: var(--text-muted);">
                            </div>
                        </div>

                        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                            <label class="heading-clash" style="font-size: 0.7rem; color: var(--text-muted);">Format /
                                Language</label>
                            <select id="calendar-lang-input"
                                style="background: transparent; border: 1px solid var(--border-subtle); padding: 0.5rem; color: var(--text-off-white); font-family: var(--font-body); border-radius: 4px; outline: none;">
                                <option value="nepali" style="background: var(--bg-charcoal);">Nepali Only</option>
                                <option value="english" style="background: var(--bg-charcoal);">English Only</option>
                                <option value="both" style="background: var(--bg-charcoal);" selected>Both (Dual Layout)
                                </option>
                            </select>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                            <label class="heading-clash" style="font-size: 0.7rem; color: var(--text-muted);">Year
                                (BS)</label>
                            <select id="calendar-year-input"
                                style="background: transparent; border: 1px solid var(--border-subtle); padding: 0.5rem; color: var(--text-off-white); font-family: var(--font-body); border-radius: 4px; outline: none;">
                            </select>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                            <label class="heading-clash" style="font-size: 0.7rem; color: var(--text-muted);">Cover
                                Image (For Active Month)</label>
                            <input type="file" id="calendar-image-input" accept="image/*"
                                style="font-size: 0.8rem; color: var(--text-muted);">

                        </div>

                        <hr style="border: none; border-top: 1px dashed var(--border-subtle);">
                        <p class="heading-clash" style="font-size: 0.7rem; color: var(--accent-amber); margin: 0;">
                            Customize</p>
                        <div style="display: flex; flex-direction: column; gap: 0.6rem;">
                            <div style="display: flex; flex-direction: column; gap: 0.3rem;">
                                <label style="font-size: 0.65rem; color: var(--text-muted);">Font</label>
                                <select id="user-font-input"
                                    style="background: var(--bg-charcoal); border: 1px solid var(--border-subtle); padding: 0.4rem; color: var(--text-off-white); border-radius: 4px; outline: none;">
                                    <option value="'Inter', sans-serif" style="background: var(--bg-charcoal);">Inter
                                    </option>
                                    <option value="'Playfair Display', serif" style="background: var(--bg-charcoal);">
                                        Playfair Display</option>
                                    <option value="'Quicksand', sans-serif" style="background: var(--bg-charcoal);">
                                        Quicksand</option>
                                    <option value="'Outfit', sans-serif" style="background: var(--bg-charcoal);">Outfit
                                    </option>
                                    <option value="'Caveat', cursive" style="background: var(--bg-charcoal);">Caveat
                                    </option>
                                    <option value="'Merriweather', serif" style="background: var(--bg-charcoal);">
                                        Merriweather</option>
                                    <option value="'Mukta', sans-serif" style="background: var(--bg-charcoal);">
                                        Traditional (Nepali)</option>
                                </select>
                            </div>
                            <div style="display: flex; align-items: center; justify-content: space-between;">
                                <label style="font-size: 0.65rem; color: var(--text-muted);">Accent Color</label>
                                <input type="color" id="user-accent-color" value="#e8a430"
                                    style="width: 38px; height: 26px; border: 1px solid var(--border-subtle); border-radius: 4px; cursor: pointer; padding: 2px; background: transparent;">
                            </div>
                            <div style="display: flex; align-items: center; justify-content: space-between;">
                                <label style="font-size: 0.65rem; color: var(--text-muted);">Title Color</label>
                                <input type="color" id="user-title-color" value="#ffffff"
                                    style="width: 38px; height: 26px; border: 1px solid var(--border-subtle); border-radius: 4px; cursor: pointer; padding: 2px; background: transparent;">
                            </div>
                            <div style="display: flex; align-items: center; justify-content: space-between;">
                                <label style="font-size: 0.65rem; color: var(--text-muted);">Background</label>
                                <input type="color" id="user-bg-color" value="#ffffff"
                                    style="width: 38px; height: 26px; border: 1px solid var(--border-subtle); border-radius: 4px; cursor: pointer; padding: 2px; background: transparent;">
                            </div>
                        </div>

                        <hr style="border: none; border-top: 1px dashed var(--border-subtle);">
                        <div id="image-tuning-box" style="display: flex; flex-direction: column; gap: 0.8rem;">
                            <div style="display: flex; align-items: center; justify-content: space-between;">
                                <p class="heading-clash"
                                    style="font-size: 0.7rem; color: var(--accent-amber); margin: 0;">Image Tuning</p>
                                <button id="btn-reset-image"
                                    style="background: transparent; border: 1px solid var(--border-subtle); color: var(--text-muted); font-size: 0.6rem; padding: 2px 8px; border-radius: 10px; cursor: pointer; transition: all 0.2s;">Reset</button>
                            </div>

                            <div style="display: flex; flex-direction: column; gap: 0.3rem;">
                                <div
                                    style="display: flex; justify-content: space-between; font-size: 0.62rem; color: var(--text-muted);">
                                    <label>Zoom</label>
                                    <span id="label-zoom">1.0x</span>
                                </div>
                                <input type="range" id="img-zoom" min="1" max="3" step="0.1" value="1"
                                    style="width: 100%; accent-color: var(--accent-amber); cursor: pointer; background: rgba(255,255,255,0.05); height: 4px; border-radius: 2px;">
                            </div>

                            <div style="display: flex; flex-direction: column; gap: 0.3rem;">
                                <div
                                    style="display: flex; justify-content: space-between; font-size: 0.62rem; color: var(--text-muted);">
                                    <label>Horizontal Pan</label>
                                    <span id="label-pan-x">50%</span>
                                </div>
                                <input type="range" id="img-pan-x" min="0" max="100" step="1" value="50"
                                    style="width: 100%; accent-color: var(--accent-amber); cursor: pointer; background: rgba(255,255,255,0.05); height: 4px; border-radius: 2px;">
                            </div>

                            <div style="display: flex; flex-direction: column; gap: 0.3rem;">
                                <div
                                    style="display: flex; justify-content: space-between; font-size: 0.62rem; color: var(--text-muted);">
                                    <label>Vertical Pan</label>
                                    <span id="label-pan-y">50%</span>
                                </div>
                                <input type="range" id="img-pan-y" min="0" max="100" step="1" value="50"
                                    style="width: 100%; accent-color: var(--accent-amber); cursor: pointer; background: rgba(255,255,255,0.05); height: 4px; border-radius: 2px;">
                            </div>
                        </div>
                    </div>

                    <hr style="border: none; border-top: 1px solid var(--border-subtle);">

                    <button id="btn-download-pdf" class="btn-premium btn-primary"
                        style="border: none; cursor: pointer; text-align: center; justify-content: center; width: 100%;">
                        <i class="fas fa-file-pdf" style="margin-right: 8px;"></i> Download PDF
                    </button>
                </aside>

                <!-- Live Preview Area -->
                <section
                    style="background: var(--bg-card); padding: 2rem; border: 1px dashed var(--accent-amber); border-radius: 12px; display: flex; justify-content: center; align-items: center; overflow: hidden; min-height: 500px; position: relative;">

                    <button id="slider-prev"
                        style="display: none; position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: #fff; border: 1px solid var(--border-subtle); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; z-index: 10;"><i
                            class="fa-solid fa-chevron-left"></i></button>

                    <div id="preview-wrapper"
                        style="box-shadow: 0 10px 30px rgba(0,0,0,0.5); transform-origin: center center; transition: all 0.3s ease;">
                        <!-- Layout injected here -->
                    </div>

                    <button id="slider-next"
                        style="display: none; position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: #fff; border: 1px solid var(--border-subtle); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; z-index: 10;"><i
                            class="fa-solid fa-chevron-right"></i></button>

                </section>
            </div>
        </div>
    </main>

    <footer
        style="padding: 4rem var(--site-padding); background: var(--bg-card); border-top: 1px solid var(--border-subtle); text-align: center;">
        <p style="font-size: 0.8rem; letter-spacing: 0.1em; color: var(--text-muted);">© 2026 Arun Karki |
            arunkarki1023.com.np</p>
    </footer>

    <!-- Event Modal -->
    <div id="event-modal-overlay"
        style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;">
        <div
            style="background: var(--bg-card); border: 1px solid var(--border-subtle); padding: 2rem; border-radius: 12px; width: 350px; display: flex; flex-direction: column; gap: 1rem;">
            <h3 class="heading-clash" style="margin: 0; color: var(--accent-amber);">Manage Day <span
                    id="modal-day-label"></span></h3>

            <div style="display: flex; flex-direction: column; gap: 0.5rem; margin-top: 1rem;">
                <label style="font-size: 0.8rem; color: var(--text-muted);">Event Name</label>
                <input type="text" id="modal-event-name" placeholder="e.g. Workshop"
                    style="background: transparent; border: 1px solid var(--border-subtle); padding: 0.8rem; color: var(--text-off-white); border-radius: 4px; outline: none;">
            </div>

            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                <label style="font-size: 0.8rem; color: var(--text-muted);">Event Type</label>
                <select id="modal-event-type"
                    style="background: transparent; border: 1px solid var(--border-subtle); padding: 0.8rem; color: var(--text-off-white); border-radius: 4px; outline: none;">
                    <option value="holiday" style="background: var(--bg-charcoal);">Holiday (Red)</option>
                    <option value="event" style="background: var(--bg-charcoal);">Event (Blue)</option>
                </select>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                <button id="modal-btn-save" class="btn-premium btn-primary"
                    style="flex: 1; border: none; cursor: pointer; padding: 0.6rem;">Save</button>
                <button id="modal-btn-delete" class="btn-premium"
                    style="flex: 1; border: 1px solid #ff3b30; color: #ff3b30; background: transparent; cursor: pointer; padding: 0.6rem;">Clear</button>
            </div>
            <button id="modal-btn-close"
                style="margin-top: 0.5rem; border: none; background: transparent; color: var(--text-muted); cursor: pointer; padding: 0.6rem;">Cancel</button>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nepali-datetime/dist/index.min.js"></script>
    <script src="create.js"></script>
    <script src="script.js"></script>
</body>

</html>
